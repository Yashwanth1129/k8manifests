apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: yashwanth1129/orders-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: MONGODB_HOST
              value: "192.168.1.107"

            - name: MONGODB_PORT
              value: "27017"

            - name: MONGODB_DATABASE
              value: "OrdersDatabase"

            - name: UsersMicroserviceName
              value: "users-service"

            - name: UsersMicroservicePort
              value: "8080"

            - name: ProductsMicroserviceName
              value: "products-service"

            - name: ProductsMicroservicePort
              value: "8080"